apiVersion: 1

datasources:
  - name: 'nominal'
    uid: 'nominal'
    type: 'nominal-nominalds-datasource'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      baseUrl: 'https://api-staging.gov.nominal.io/api'
      # Optional. Limits asset search to one workspace.
      # workspaceRid: 'ri.security.gov-staging.workspace.<uuid>'
    secureJsonData:
      apiKey: '${NOMINAL_API_KEY}'
